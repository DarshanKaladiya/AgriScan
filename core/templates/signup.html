{% extends 'base.html' %}

{% block title %}Sign Up | AgriScan{% endblock %}

{% block content %}
<div style="display: flex; justify-content: center; align-items: center; min-height: 75vh; padding: 2rem 0;">
    <div class="glass-card animate-up" style="max-width: 480px; width: 100%; padding: 2.5rem 2rem;">
        
        <div style="text-align: center; margin-bottom: 2rem;">
            <div style="width: 56px; height: 56px; border-radius: 18px; background: rgba(0, 255, 136, 0.12); display: flex; align-items: center; justify-content: center; margin: 0 auto 1rem; color: var(--primary);">
                <i data-lucide="user-plus" style="width: 30px; height: 30px;"></i>
            </div>
            <h2 style="font-size: 1.8rem; font-weight: 800; color: #fff; margin-bottom: 0.4rem;">Create Farmer Account</h2>
            <p style="color: var(--text-dim); font-size: 0.9rem;">Keep your scan history saved and synced across devices</p>
        </div>

        <form method="POST" action="{% url 'signup' %}">
            {% csrf_token %}

            <div style="margin-bottom: 1.2rem;">
                <label style="display: block; font-size: 0.85rem; font-weight: 700; color: var(--text-dim); margin-bottom: 0.5rem;">
                    Full Name
                </label>
                <div style="position: relative;">
                    <i data-lucide="user" style="position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); width: 18px; color: var(--text-dim);"></i>
                    <input type="text" name="name" required placeholder="e.g. Ramesh Patel" style="width: 100%; padding: 0.85rem 1rem 0.85rem 2.8rem; border-radius: 12px; font-size: 0.95rem; font-family: inherit;">
                </div>
            </div>

            <div style="margin-bottom: 1.2rem;">
                <label style="display: block; font-size: 0.85rem; font-weight: 700; color: var(--text-dim); margin-bottom: 0.5rem;">
                    Mobile Number or Email
                </label>
                <div style="position: relative;">
                    <i data-lucide="smartphone" style="position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); width: 18px; color: var(--text-dim);"></i>
                    <input type="text" name="login_id" required placeholder="10-digit mobile number or email" style="width: 100%; padding: 0.85rem 1rem 0.85rem 2.8rem; border-radius: 12px; font-size: 0.95rem; font-family: inherit;">
                </div>
                <span style="font-size: 0.75rem; color: var(--text-dim); margin-top: 0.3rem; display: block;">Used for login on both the website and mobile app.</span>
            </div>

            <div style="margin-bottom: 1.2rem;">
                <label style="display: block; font-size: 0.85rem; font-weight: 700; color: var(--text-dim); margin-bottom: 0.5rem;">
                    Password
                </label>
                <div style="position: relative;">
                    <i data-lucide="lock" style="position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); width: 18px; color: var(--text-dim);"></i>
                    <input type="password" name="password" minlength="6" required placeholder="Minimum 6 characters" style="width: 100%; padding: 0.85rem 1rem 0.85rem 2.8rem; border-radius: 12px; font-size: 0.95rem; font-family: inherit;">
                </div>
            </div>

            <div style="margin-bottom: 1.8rem;">
                <label style="display: block; font-size: 0.85rem; font-weight: 700; color: var(--text-dim); margin-bottom: 0.5rem;">
                    Preferred Advisory Language
                </label>
                <div style="position: relative;">
                    <i data-lucide="languages" style="position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); width: 18px; color: var(--text-dim);"></i>
                    <select name="preferred_language" style="width: 100%; padding: 0.85rem 1rem 0.85rem 2.8rem; border-radius: 12px; font-size: 0.95rem; font-family: inherit;">
                        <option value="en">English (Default)</option>
                        <option value="gu">ગુજરાતી (Gujarati)</option>
                        <option value="hi">हिंदी (Hindi)</option>
                    </select>
                </div>
            </div>

            <button type="submit" class="btn-premium" style="width: 100%; justify-content: center; padding: 0.9rem; font-size: 1rem; margin-bottom: 1.5rem;">
                <i data-lucide="check-circle" style="width: 18px;"></i> Create Account
            </button>
        </form>

        <div style="text-align: center; border-top: 1px solid var(--surface-border); padding-top: 1.5rem; font-size: 0.88rem; color: var(--text-dim);">
            Already have an account? 
            <a href="{% url 'login' %}" style="color: var(--primary); font-weight: 700; text-decoration: none; margin-left: 0.3rem;">Sign In</a>
        </div>
    </div>
</div>
{% endblock %}
